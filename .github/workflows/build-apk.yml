name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "manifest.json"
      - "package.json"
      - "capacitor.config.json"
      - "native-auth.js"
      - "google-services.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app build tools
        run: npm install

      - name: Prepare web app files
        run: |
          mkdir -p www
          cp index.html app.js manifest.json www/
          npx esbuild native-auth.js --bundle --format=esm --outfile=www/native-auth.bundle.js
          if [ -f icon-192.png ]; then cp icon-192.png www/; fi
          if [ -f icon-512.png ]; then cp icon-512.png www/; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase and stable debug signing
        run: |
          mkdir -p "$HOME/.android"
          cp android-debug.keystore "$HOME/.android/debug.keystore"
          cp google-services.json android/app/google-services.json
          sed -i "/dependencies {/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          printf "\\next {\\n    rgcfaIncludeGoogle = true\\n    androidxCredentialsVersion = '1.3.0'\\n}\\n" >> android/variables.gradle
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Generate Android launcher icons
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon-only.png
          npx capacitor-assets generate --android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Add detailed Credential Manager error diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/node_modules/@capacitor-firebase/authentication/android/src/main/java/io/capawesome/capacitorjs/plugins/firebase/authentication/handlers/GoogleAuthProviderHandler.java")
          if not path.exists():
              path = Path("node_modules/@capacitor-firebase/authentication/android/src/main/java/io/capawesome/capacitorjs/plugins/firebase/authentication/handlers/GoogleAuthProviderHandler.java")
          source = path.read_text()
          old = """    private void handleGetCredentialError(final PluginCall call, final boolean isLink, final GetCredentialException exception) {
                  if (isLink) {
                      pluginImplementation.handleFailedLink(call, null, exception);
                  } else {
                      pluginImplementation.handleFailedSignIn(call, null, exception);
                  }
              }"""
          new = """    private void handleGetCredentialError(final PluginCall call, final boolean isLink, final GetCredentialException exception) {
                  String diagnostic = "Credential Manager exception=" + exception.getClass().getName()
                      + "; message=" + exception.getMessage();
                  Throwable cause = exception.getCause();
                  if (cause != null) {
                      diagnostic += "; cause=" + cause.getClass().getName() + ": " + cause.getMessage();
                  }
                  if (isLink) {
                      pluginImplementation.handleFailedLink(call, diagnostic, exception);
                  } else {
                      pluginImplementation.handleFailedSignIn(call, diagnostic, exception);
                  }
              }"""
          if old not in source:
              raise SystemExit("Could not locate expected Credential Manager error handler; stopping build.")
          path.write_text(source.replace(old, new, 1))
          print(f"Patched native diagnostic handler: {path}")

      - name: Configure permanent APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-grocery-list-release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/family-grocery-list-release.jks"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          source = path.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in source:
              source = source.replace("android {", "android {\n" + signing, 1)
          if "signingConfig signingConfigs.release" not in source:
              source = source.replace("buildTypes {", "buildTypes {\\n        debug {\\n            signingConfig signingConfigs.release\\n        }", 1)
          path.write_text(source)
          PY
          keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-grocery-list-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
