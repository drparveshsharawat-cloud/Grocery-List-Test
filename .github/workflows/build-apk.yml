name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "manifest.json"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app build tools
        run: npm install

      - name: Prepare web app files
        run: |
          mkdir -p www
          cp index.html app.js manifest.json www/
          if [ -f icon-192.png ]; then cp icon-192.png www/; fi
          if [ -f icon-512.png ]; then cp icon-512.png www/; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-grocery-list-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
